name: Empacotar Addon Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empacotar
  cancel-in-progress: true

jobs:
  mcaddon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Montar o .mcaddon
        run: python ferramentas/empacotar.py --simples -o Addon_Pack_Completo.mcaddon | tee montagem.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mcaddon
          path: |
            Addon_Pack_Completo.mcaddon
            montagem.txt
          retention-days: 1

  publicar:
    needs: [mcaddon]
    # rodando a mao numa outra branch, so testa a montagem; a release so muda com a main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publicar na release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          N=$(grep -o 'montagem [0-9]*' mcaddon/montagem.txt | head -1)
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima \
            "mcaddon/Addon_Pack_Completo.mcaddon" \
            --title "Addon Pack (última montagem)" \
            --notes "$(printf '%s, gerada do commit %s.\n\n- **Addon_Pack_Completo.mcaddon**: o pack pronto. Antes de importar, apague do jogo os packs antigos do Addon Pack.' "${N^}" "${GITHUB_SHA::7}")" \
            --target "$GITHUB_SHA"
