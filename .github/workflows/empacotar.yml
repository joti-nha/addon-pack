name: Empacotar Addon Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empacotar
  cancel-in-progress: true

jobs:
  mcaddon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Montar o .mcaddon
        run: python ferramentas/empacotar.py --simples -o Addon_Pack_Completo.mcaddon | tee montagem.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mcaddon
          path: |
            Addon_Pack_Completo.mcaddon
            montagem.txt
          retention-days: 1

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ferramentas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar o .exe da janela
        run: |
          python -m pip install --quiet pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name "Empacotador Addon Pack" `
            --icon ferramentas/recursos/icone.ico `
            --add-data "ferramentas/recursos;recursos" `
            ferramentas/empacotador_janela.py
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/Empacotador Addon Pack.exe
          retention-days: 1

  publicar:
    needs: [mcaddon, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publicar na release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          N=$(grep -o 'montagem [0-9]*' mcaddon/montagem.txt | head -1)
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima \
            "mcaddon/Addon_Pack_Completo.mcaddon" \
            "exe/Empacotador Addon Pack.exe" \
            --title "Addon Pack (última montagem)" \
            --notes "$(printf '%s, gerada do commit %s.\n\n- **Addon_Pack_Completo.mcaddon**: o pack pronto. Antes de importar, apague do jogo os packs antigos do Addon Pack.\n- **Empacotador Addon Pack.exe**: o empacotador com janela, para Windows. Coloque na pasta do repositório (a que tem packs/) e dê dois cliques.' "${N^}" "${GITHUB_SHA::7}")" \
            --target "$GITHUB_SHA"
